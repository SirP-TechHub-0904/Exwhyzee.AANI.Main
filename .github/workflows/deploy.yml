name: Deploy Exwhyzee AANI to Hostinger VPS

on:
  push:
    branches:
      - master
    paths:
      - 'Exwhyzee.AANI.Web/**'
      - 'Exwhyzee.AANI.Domain/**'
      - 'PostmarkEmailService/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy Web Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore Exwhyzee.AANI.Web/Exwhyzee.AANI.Web.csproj

      - name: Publish Application
        run: |
          dotnet publish Exwhyzee.AANI.Web/Exwhyzee.AANI.Web.csproj \
            -c Release \
            -o ./publish

      - name: Configure SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Prepare Remote Directory & Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} -H ${{ secrets.HOSTINGER_SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SERVER_IP }} "mkdir -p /var/www/aani"

      - name: Deploy to Hostinger VPS (Preserving .env)
        run: |
          rsync -avz --delete \
            --exclude='.env*' \
            --exclude='wwwroot/Uploads/*' \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            ./publish/ \
            ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SERVER_IP }}:/var/www/aani/

      - name: Restart Systemd Service
        run: |
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SERVER_IP }} "sudo systemctl restart aani-web || true"
